name: Validate platform
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check src scripts tests
      - run: pytest -q
      - run: python scripts/bootstrap.py --cached
      - run: python scripts/check_marts.py
      - run: python scripts/validate_powerbi.py
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medsupply
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: medsupply_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U medsupply -d medsupply_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://medsupply:ci_only_password@localhost:5432/medsupply_test
      PGUSER: medsupply
      PGPASSWORD: ci_only_password
      PGDATABASE: medsupply_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev,postgres]'
      - run: pytest tests/test_postgres.py -q
      - run: dbt build --project-dir dbt --profiles-dir dbt
