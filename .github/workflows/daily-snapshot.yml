name: Collect daily shortage snapshot
on:
  # Exercise the real job during review without enabling the main-branch schedule.
  push:
    branches: [finish-project]
    paths: [.github/workflows/daily-snapshot.yml]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: daily-shortage-history-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - name: Restore cumulative history from the last successful run on this branch
        shell: bash
        run: |
          set -euo pipefail
          workflow_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          # A rerun can restore the artifact from its own earlier attempt.
          has_own_history=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq 'any(.artifacts[]; .name == "daily-shortage-history")')
          echo "Run attempt $GITHUB_RUN_ATTEMPT; own saved history: $has_own_history"
          if [ "$has_own_history" = true ]; then
            previous=$GITHUB_RUN_ID
          else
            previous=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow_id" --branch "$GITHUB_REF_NAME" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          fi
          if [ -n "$previous" ]; then
            echo "Restoring history from run $previous"
            gh run download "$previous" --repo "$GITHUB_REPOSITORY" --name daily-shortage-history --dir history
            test -f history/state.json
            test -n "$(find history -maxdepth 1 -name '????-??-??.json' -print -quit)"
          else
            if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
              echo 'No saved history is available for this rerun; refusing to start over.' >&2
              exit 1
            fi
            echo 'No previous successful run; starting the first collection.'
            mkdir -p history
          fi
      - name: Download, validate and publish at most one observation per UTC day
        run: |
          python scripts/collect_daily.py
          python scripts/check_marts.py
          python -c 'import json; from pathlib import Path; Path("history/state.json").write_text(json.dumps({"format_version": 1, "note": "Cumulative real daily observations; no test fixtures"}) + "\n")'
      - name: Store cumulative raw history
        uses: actions/upload-artifact@v4
        with:
          name: daily-shortage-history
          path: history/
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Store generated CSVs for Power BI
        uses: actions/upload-artifact@v4
        with:
          name: daily-powerbi-exports
          path: data/exports/
          if-no-files-found: error
          retention-days: 90
          overwrite: true
