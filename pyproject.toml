[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medsupply-monitor"
version = "1.0.0"
description = "German reported medicine shortage monitoring with auditable snapshots and cited evidence"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1", "jsonschema>=4,<5"]
postgres = ["psycopg[binary]>=3.2,<4", "dbt-postgres>=1.9,<2"]

[project.scripts]
medsupply = "medsupply.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medsupply = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
